---
- name: Prepare isolated container fixtures
  hosts: fridge_controllers
  gather_facts: false
  vars_files:
    - ../inventory/host_vars/jpi4.yml
  vars:
    test_config: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../controller/config.yaml') | from_yaml }}"
  tasks:
    - name: Check the container marker without reading it
      ansible.builtin.stat:
        path: /run/.containerenv
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: test_container_marker

    - name: Require a local container and loopback MQTT configuration
      ansible.builtin.assert:
        that:
          - ansible_connection == "local"
          - test_container_marker.stat.exists
          - test_config.mqtt.broker in ["localhost", "127.0.0.1"]
          - test_config.mqtt.port == 1883
        fail_msg: This fixture playbook must run only inside the isolated test container.

    - name: Create the fixture group
      ansible.builtin.group:
        name: "{{ fridge_controller_group }}"

    - name: Create the fixture account
      ansible.builtin.user:
        name: "{{ fridge_controller_user }}"
        group: "{{ fridge_controller_group }}"
        create_home: true

    - name: Create the fixture installation directory
      ansible.builtin.file:
        path: "{{ fridge_controller_directory }}"
        state: directory
        owner: "{{ fridge_controller_user }}"
        group: "{{ fridge_controller_group }}"
        mode: "0755"

    - name: Generate a container-only password
      ansible.builtin.set_fact:
        test_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Provision the fixture controller password
      ansible.builtin.copy:
        content: "{{ test_password }}"
        dest: "{{ fridge_controller_password_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Create the fixture broker account
      ansible.builtin.command:
        argv:
          - mosquitto_passwd
          - -c
          - -b
          - /etc/mosquitto/fridge-test-passwd
          - "{{ test_config.mqtt.username }}"
          - "{{ test_password }}"
      changed_when: true
      no_log: true

    - name: Set fixture broker password-file permissions
      ansible.builtin.file:
        path: /etc/mosquitto/fridge-test-passwd
        owner: mosquitto
        group: mosquitto
        mode: "0600"

    - name: Configure the container-only broker
      ansible.builtin.copy:
        dest: /etc/mosquitto/mosquitto.conf
        content: |
          listener 1883 127.0.0.1
          allow_anonymous false
          password_file /etc/mosquitto/fridge-test-passwd
        owner: root
        group: root
        mode: "0644"

    - name: Start the fixture broker
      ansible.builtin.systemd_service:
        name: mosquitto.service
        enabled: true
        state: restarted
