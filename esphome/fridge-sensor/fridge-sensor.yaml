esphome:
  name: fridge-sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  power_save_mode: none

  ap:
    ssid: "Fridge Sensor Fallback"
    password: !secret fallback_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: 192.168.178.29
  username: !secret mqtt_username
  password: !secret mqtt_password
  log_topic: null
  idf_send_async: true
  reboot_timeout: 15min

one_wire:
  - platform: gpio
    pin: GPIO18
    id: bus_keg

  - platform: gpio
    pin: GPIO16
    id: bus_air
    
sensor:
  - platform: dallas_temp
    one_wire_id: bus_keg
    name: "Keg Wall Temperature"
    update_interval: 10s

  - platform: dallas_temp
    one_wire_id: bus_air
    name: "Fridge Air Temperature"
    update_interval: 10s

api:
  encryption:
    key: !secret api_encryption_key

  reboot_timeout: 15min
